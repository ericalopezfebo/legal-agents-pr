[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "legal-agents-pr"
version = "0.1.0"
description = "Provider-agnostic legal AI agents for Puerto Rico"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Erica Lopez Febo" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
openai = ["openai>=1"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1"]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "build>=1.2"]

[project.scripts]
legal-agents-pr = "legal_agents_pr.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_agents_pr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
packages = ["legal_agents_pr"]
ignore_missing_imports = true
